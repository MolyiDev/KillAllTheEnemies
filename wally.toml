[package]
name = "molyi/kill-all-the-monsters"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
vide = "centau/vide@0.4.1"
Promise = "arxkdev/typed-promise@4.0.2"
Butler = "molyidev/butler@1.2.2"
Ignis = "molyidev/ignis@0.1.2"
Signal = "molyidev/signal@1.0.3"
DocumentService = "anthony0br/documentservice@1.2.2"
jecs = "ukendio/jecs@0.11.0"
jabby = "alicesaidhi/jabby@0.2.0"
t = "osyrisrblx/t@3.1.1"
conch = "alicesaidhi/conch@0.3.1"
# The UI Labs UTILITY package, which is what a *.story.luau gets its advanced controls from: a dropdown, a
# slider, a bounded number. Without it a choice is a bare text box and a number is an unbounded drag field.
UILabs = "pepeeltoro41/ui-labs@2.4.2"
